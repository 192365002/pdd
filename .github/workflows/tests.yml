name: DeepVerify Automated Test Suite & CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Automated Test Suite (TC01 - TC15)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install System Dependencies & Python Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libsndfile1 ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: 🚀 Execute Pytest Automated Tests (TC01 - TC15)
        run: |
          mkdir -p test-reports
          python -m pytest tests/test_deepverify_suite.py -v -s --tb=short --junitxml=test-reports/junit.xml

      - name: 🌐 Run Selenium Web Automation Test Suite (370+ Tests)
        run: |
          python selenium_test/run_tests.py

      - name: 📱 Run Appium Mobile Automation Test Suite (500 Tests)
        run: |
          python appium_test/run_tests.py

      - name: 🔬 Run Backend REST API & Classifier Test Suite (344 Tests)
        run: |
          python "backend test/run_tests.py"

      - name: 📊 Publish Test Summary to GitHub Actions Summary
        if: always()
        run: |
          if [ -f test-reports/test_report.md ]; then
            cat test-reports/test_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📤 Upload All Test Reports & Excel Artifacts (Pytest, Selenium, Appium, Backend)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-automated-test-reports
          path: |
            test-reports/junit.xml
            test-reports/test_report.md
            selenium_test/*.xlsx
            appium_test/*.xlsx
            backend test/*.xlsx
          retention-days: 30
