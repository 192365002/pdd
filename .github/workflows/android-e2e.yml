# SocialShield Mobile E2E Testing Pipeline
name: Android Mobile E2E Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e-testing:
    name: Mobile E2E Suite (500 Parametric Tests)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd SocialShieldAppium
          npm install

      - name: Run E2E Tests (Standalone - No Device Required)
        run: |
          echo "Running 500 parametric tests via standalone Mocha runner..."
          cd SocialShieldAppium
          node scripts/standalone_runner.js

      - name: Copy Reports for Archive & History
        if: always()
        run: |
          mkdir -p reports/latest
          mkdir -p reports/history/build-${{ github.run_number }}
          cp -r SocialShieldAppium/reports/* reports/latest/ || true
          cp -r SocialShieldAppium/reports/* reports/history/build-${{ github.run_number }}/ || true

      - name: Upload Test Artifacts (Excel & HTML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SocialShield-E2E-Reports
          path: |
            reports/latest/
            SocialShieldAppium/reports/SocialShield_Test_Report.xlsx
            SocialShieldAppium/reports/execution-report.html
          retention-days: 30
