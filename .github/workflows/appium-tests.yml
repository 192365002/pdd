name: SocialShield Appium Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium-tests:
    name: Generate Appium QA Reports (500 Test Cases)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Report Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl reportlab

      - name: Run Standalone 500-Test Report Generator
        run: |
          echo "Generating 500 parametric test cases Excel, HTML, and PDF reports..."
          cd AppiumFramework
          python scratch_report_generator.py

      - name: Upload Test Automation Reports Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SocialShield-QA-Reports
          path: |
            AppiumFramework/reports/
          retention-days: 30
